name: Package docs

# Regenerates docs/packages/*/data-model.md from the package source repos and opens a PR if anything changed.
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:packages
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/package-docs
          title: Update package data-model docs
          commit-message: Update package data-model docs
          body: Regenerated by `npm run docs:packages` from the package source repos.
